*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Andika',Verdana,sans-serif;color:var(--ink);background:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
input,textarea,select{font:inherit;color:inherit;-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;cursor:pointer}
#app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100vh;height:100dvh}

/* top bar */
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#fff;border-bottom:3px solid var(--ink);min-width:0}
.brand{font-weight:700;font-size:15px;line-height:1.1;max-width:120px}
.steps{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none;padding:2px}
.steps::-webkit-scrollbar{display:none}
.step{border:3px solid var(--ink);border-radius:14px;background:#fff;padding:5px 10px;font-weight:700;font-size:16px;white-space:nowrap;display:flex;align-items:center;gap:6px;flex:none}
.step .n{width:22px;height:22px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-size:13px;border:2px solid var(--ink)}
.step.on{background:var(--ink);color:#fff}
.grp{display:flex;align-items:center;gap:6px;border:3px solid var(--ink);border-radius:14px;background:#fff;padding:5px 10px;font-weight:700;font-size:15px;white-space:nowrap;flex:none}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--ink);display:inline-block;flex:none}
.icon-btn{width:44px;height:44px;border:3px solid var(--ink);border-radius:50%;background:#fff;display:grid;place-items:center;padding:0;flex:none;position:relative}
.icon-btn svg{width:26px;height:26px}
.gear{border-color:#b9b1a0;opacity:.75}
.gear .ring{position:absolute;inset:-3px;width:44px;height:44px;transform:rotate(-90deg)}
.gear .ring circle{fill:none;stroke:var(--orange);stroke-width:4;stroke-dasharray:126;stroke-dashoffset:126}
.gear.holding .ring circle{transition:stroke-dashoffset .8s linear;stroke-dashoffset:0}
@media (max-width:860px){.brand{display:none}}
@media (max-width:520px){.grp .gl{display:none}.step{font-size:14px;padding:4px 8px}.top{gap:6px;padding:6px 8px}}

/* main + ask */
#main{overflow:auto;padding:12px 16px;min-height:0}
.ask{border-top:3px solid var(--ink);background:#fff;padding:6px 12px 6px 16px;display:flex;align-items:center;gap:12px;min-height:58px}
.ask .lbl{font-size:13px;color:var(--soft);font-weight:700;flex:none;width:88px;line-height:1.15}
.ask .lbl small{display:block;font-weight:400;color:#8a7a52}
.ask .q{font-family:'Caveat',cursive;font-size:30px;color:var(--blue);line-height:1.05;font-weight:700;flex:1;min-width:0}
.more{border:2px solid var(--ink);border-radius:999px;background:#fff;padding:3px 12px;font-weight:700;font-size:14px;flex:none;white-space:nowrap}
@media (max-width:520px){.ask .q{font-size:23px}.ask{padding:6px 8px;gap:8px}.ask .lbl{width:64px;font-size:11px}.more{font-size:12px;padding:2px 8px}}
.lead{margin:0;font-size:17px;color:var(--soft)}
.screen{display:flex;flex-direction:column;gap:10px;min-height:100%}
.rowtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}

/* cards */
.card{position:relative;background:#fff;border:3px solid var(--ink);border-radius:14px;box-shadow:3px 3px 0 var(--ink);display:flex;flex-direction:column;align-items:center;padding:4px 4px 6px;touch-action:none;cursor:grab}
.card svg{width:100%;height:auto;display:block;aspect-ratio:1}
.card .nm{font-size:13px;line-height:1.1;text-align:center;min-height:2.2em;display:flex;align-items:center}
.card.mini{width:62px;padding:2px;border-width:2px;border-radius:10px;box-shadow:2px 2px 0 var(--ink)}
.card.sel{outline:5px solid var(--yellow);outline-offset:1px}
.card.dragging{opacity:.3}
.card.locked{cursor:default;background:#f4f1ea}
.card .badge{position:absolute;right:-8px;top:-8px;width:26px;height:26px;background:#fff;border:2px solid var(--ink);border-radius:50%;padding:1px}
.card .badge svg{aspect-ratio:auto}
.card .wdot{position:absolute;left:-6px;top:-6px;width:20px;height:20px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);font-size:12px;font-weight:700;display:grid;place-items:center}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:60;opacity:.95;box-shadow:6px 6px 0 rgba(35,50,79,.35)}
.zone.hl{outline:4px dashed var(--orange);outline-offset:-4px;background-color:#fff8e6!important}
.empty{margin:auto;color:var(--soft);font-size:17px}
.tray .empty{grid-column:1/-1}

/* chips: reasons, predictions */
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);border-radius:999px;background:#fff;padding:2px 12px 2px 3px;font-weight:700;font-size:16px;white-space:nowrap}
.chip svg{width:34px;height:34px;flex:none}
.chip.on{background:var(--yellow)}
.chip:disabled{opacity:.35;cursor:default}
.why{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:58px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:5px 10px}
.why .wt{width:44px;height:44px;flex:none}
.why .wt svg{width:100%;height:100%}
.why b{font-size:19px}
.why .hint{color:var(--soft);font-size:16px}
.rsn{display:inline-flex;gap:1px;flex:none}.rsn svg{width:17px;height:17px}
.idea{display:inline-flex;align-items:center;gap:8px;border:2px dashed var(--ink);border-radius:14px;background:#fff;padding:3px 12px 3px 6px;font-size:15px;text-align:left;max-width:100%;min-width:0}
.idea svg{width:32px;height:32px;flex:none}
.idea b{white-space:nowrap}
.idea q{font-family:'Caveat',cursive;font-size:25px;color:var(--blue);font-weight:700;line-height:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.idea.empty-idea q{color:#9aa3b0}
.small{font-size:15px;color:var(--soft)}

/* sub tabs */
.subs{display:flex;gap:8px;flex-wrap:wrap}
.sub{border:3px solid var(--ink);border-radius:999px;background:#fff;padding:3px 14px;font-weight:700;font-size:17px}
.sub.on{background:var(--yellow)}

/* predict */
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;padding:10px;border:3px dashed #b9b1a0;border-radius:16px;background:rgba(255,255,255,.65);min-height:104px;align-content:start}
.bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;flex:1;min-height:190px}
.bin{border:3px solid var(--ink);border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:8px;min-height:140px}
.bin-h{display:flex;align-items:center;gap:8px;font-size:21px;pointer-events:none}
.bin-h svg{width:46px;height:46px;flex:none}
.bin-b{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;flex:1}
.c-ceker{background:#e4eefa}.c-cekmez{background:#fde8d4}.c-emin{background:#efede8}
@media (max-width:600px){.bins{grid-template-columns:1fr}.bin{min-height:110px}}

/* test */
.strip{display:flex;flex-wrap:wrap;gap:8px}
.strip .card{width:60px;cursor:pointer}
.strip.sm{gap:6px}.strip.sm .card{width:40px;border-radius:8px}
@media (max-width:520px){.strip.sm .card{width:36px}}
.strip .card.cur{outline:5px solid var(--yellow);outline-offset:1px}
.test-main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:12px;min-height:300px}
.stage{position:relative;overflow:hidden;border:3px solid var(--ink);border-radius:18px;background:#fff;touch-action:none;min-height:280px}
.stage .table{position:absolute;left:0;right:0;bottom:0;height:14%;background:#ead9b5;border-top:3px solid var(--ink)}
.stage .obj,.stage .mag{position:absolute;left:0;top:0;will-change:transform}
.stage .obj svg,.stage .mag svg{width:100%;height:100%;display:block}
.stage .mag{z-index:3;cursor:grab;touch-action:none}
.stage .mag.pulse::after{content:'';position:absolute;inset:-12px;border:4px solid var(--yellow);border-radius:50%;animation:pulse 1.4s ease-in-out infinite;pointer-events:none}
.stage .wall{position:absolute;z-index:2;background:repeating-linear-gradient(#fffdf6 0 12px,#e6dfcd 12px 13px);border:2px solid var(--ink);border-radius:3px;pointer-events:none}
@keyframes pulse{0%,100%{transform:scale(.9);opacity:.9}50%{transform:scale(1.08);opacity:.35}}
.rec{display:flex;flex-direction:column;gap:10px}
.rec-nm{font-size:22px;font-weight:700;line-height:1.15}
.tries{font-size:16px;color:var(--soft);display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-height:24px}
.tries i{width:12px;height:12px;border-radius:50%;background:var(--ink);display:inline-block}
.recb{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:700;border:3px solid var(--ink);border-radius:16px;padding:8px 12px;box-shadow:3px 3px 0 var(--ink);text-align:left}
.recb svg{width:54px;height:54px;flex:none}
.recb.on{outline:5px solid var(--yellow);outline-offset:2px}
.recb:disabled{opacity:.35;cursor:default}
.recb.wait{animation:nudge 1.6s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateY(-3px)}}
.rq2{margin:0;font-size:21px;font-weight:700}
@media (orientation:portrait),(max-width:760px){.test-main{grid-template-columns:1fr;grid-template-rows:minmax(280px,1fr) auto}.rec{display:grid;grid-template-columns:1fr 1fr;align-items:stretch}.rec-nm,.tries{grid-column:1/-1}}
@media (max-width:520px){.recb{font-size:19px}.recb svg{width:40px;height:40px}.rq2{font-size:18px}}

/* compare */
.cmp{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;flex:1;align-items:start;align-content:start}
.legend{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;flex-wrap:wrap}
.cmp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;align-content:start}
.crow{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:4px 8px;min-width:0;flex-wrap:wrap}
.cmp-list .crow{flex-wrap:nowrap;gap:6px}
.crow .th{width:44px;flex:none}
.crow .th svg,.crow .ic svg{width:100%;height:auto;display:block}
.crow .ic{width:38px;flex:none}
.crow .ar{font-size:22px;font-weight:700;color:var(--soft)}
.crow .none{width:38px;height:38px;border:2px dashed #b9b1a0;border-radius:50%;flex:none}
.retest{border:2px solid var(--ink);border-radius:999px;background:#fff;padding:2px 10px;font-weight:700;font-size:14px;margin-left:auto}
.shelf{background:var(--surp);border:3px solid var(--ink);border-radius:18px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:180px}
.shelf h3{margin:0;font-size:22px;display:flex;align-items:center;gap:8px}
.shelf h3 svg{width:36px;height:36px}
.shelf .crow{border-width:3px}
@media (orientation:portrait),(max-width:760px){.cmp{grid-template-columns:1fr}.shelf{order:-1;min-height:100px}}

/* groups compare */
.gcmp{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;align-content:start}
.grow{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--ink);border-radius:12px;padding:4px 8px;flex-wrap:wrap}
.grow.diff{background:var(--surp);border-width:3px}
.grow .th{width:46px;flex:none}.grow .th svg{width:100%;height:auto;display:block}
.gi{width:38px;display:flex;flex-direction:column;align-items:center;gap:1px;flex:none}
.gi .dot{width:12px;height:12px}
.gi svg{width:34px;height:34px}
.gi .none{width:30px;height:30px;border:2px dashed #cfc8b8;border-radius:50%;margin:2px}
.difftag{font-weight:700;font-size:13px;color:#9a6a00}
.gh{font-weight:700;font-size:17px;margin:4px 0 0}

/* metal */
.mgrid{display:grid;grid-template-columns:170px minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto minmax(120px,1fr) minmax(120px,1fr);gap:8px;flex:1}
.mh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:18px;line-height:1.15;padding:4px}
.mh svg{width:46px;height:46px;flex:none}
.cell{border:3px solid var(--ink);border-radius:16px;background:#fff;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;position:relative}
.cell.hot{background:var(--surp);border-style:dashed;border-width:4px}
.cell .tag{width:100%;font-weight:700;font-size:15px;color:#9a6a00;pointer-events:none}
.mtray{min-height:96px}
@media (max-width:600px){.mgrid{grid-template-columns:76px minmax(0,1fr) minmax(0,1fr)}.mh{font-size:13px;flex-direction:column;align-items:flex-start}.mh svg{width:34px;height:34px}.cell .card.mini{width:52px}}

/* map */
.map{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:center;flex:1}
.planet svg{width:100%;height:auto;max-height:calc(100dvh - 200px);display:block;margin:auto}
.planet .w{cursor:pointer}
.panel{background:#fff;border:3px solid var(--ink);border-radius:20px;box-shadow:4px 4px 0 var(--ink);padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.panel h2{margin:0;font-size:25px}
.panel .rq{font-size:23px;font-weight:700;line-height:1.3;margin:0}
.panel .plant{width:100%;height:auto;display:block;max-height:30dvh}
.soon{align-self:flex-start;background:#efede8;border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-weight:700}
.go{background:var(--green);color:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:3px 3px 0 var(--ink);padding:8px 16px;font-size:21px;font-weight:700}
.btn2{background:#fff;border:3px solid var(--ink);border-radius:16px;box-shadow:3px 3px 0 var(--ink);padding:6px 14px;font-size:17px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn2 svg{width:26px;height:26px}
.say{border:2px solid var(--ink);border-radius:50%;width:40px;height:40px;background:#fff;display:inline-grid;place-items:center;padding:0;vertical-align:middle;flex:none}
.say svg{width:22px;height:22px}
@media (max-width:600px){.map{grid-template-columns:1fr}.planet svg{max-height:40dvh}}

/* overlays */
.overlay{position:fixed;inset:0;z-index:100}
#modal{background:rgba(35,50,79,.45);display:grid;place-items:center;padding:16px}
#modal[hidden],#teacher[hidden]{display:none}
.mbox{background:#fff;border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink);padding:20px;max-width:560px;width:100%;display:flex;flex-direction:column;gap:14px;max-height:calc(100dvh - 32px);overflow:auto}
.mbox h2{margin:0;font-size:25px;display:flex;align-items:center;gap:10px}
.mbox textarea{width:100%;min-height:90px;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;font-size:18px}
.mrow{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.gpick{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gbtn{display:flex;align-items:center;gap:12px;border:3px solid var(--ink);border-radius:18px;background:#fff;padding:12px;font-size:22px;font-weight:700;box-shadow:3px 3px 0 var(--ink)}
.gbtn .dot{width:44px;height:44px;border-width:3px}
.gbtn.on{outline:5px solid var(--yellow);outline-offset:2px}
.qlist{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.qlist li{display:flex;align-items:center;gap:8px;border:2px solid #d9d3c4;border-radius:12px;padding:6px 8px;background:#fffdf7}
.qlist li span{flex:1;font-family:'Caveat',cursive;font-size:26px;color:var(--blue);font-weight:700;line-height:1.05}
.qadd{display:flex;gap:8px}
.qadd input{flex:1;min-width:0;border:2px solid var(--ink);border-radius:10px;padding:6px 10px;font-size:17px}

/* teacher */
#teacher{background:var(--paper);overflow:auto;-webkit-user-select:text;user-select:text}
.t-wrap{max-width:1120px;margin:0 auto;padding:16px}
.t-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.t-head h2{margin:0;font-size:26px;flex:1;min-width:200px}
.tbtn{border:3px solid var(--ink);border-radius:12px;background:#fff;padding:6px 12px;font-weight:700;font-size:16px}
.tbtn.on{background:var(--ink);color:#fff}
.tbtn.warn{background:#fde8d4}
.t-tabs{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.t-box{background:#fff;border:3px solid var(--ink);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.t-box h3{margin:0 0 8px;font-size:20px;display:flex;align-items:center;gap:8px}
.t-box p,.t-box li{font-size:16px;line-height:1.45}
.t-box ul{margin:0;padding-left:20px}
.t-box .cat{display:inline-block;font-size:12px;font-weight:700;background:#efede8;border-radius:999px;padding:0 8px;margin-right:6px;vertical-align:middle}
.tscroll{overflow-x:auto}
table.tt{border-collapse:collapse;width:100%;font-size:14.5px}
.tt th,.tt td{border-bottom:1px solid #d9d3c4;padding:5px 7px;text-align:left;vertical-align:top}
.tt th{background:#f4f1ea}
.tt td.s{font-weight:700;color:#9a6a00}
.ev{list-style:none;padding:0;margin:0 0 10px}
.ev li{padding:3px 0;border-bottom:1px dashed #e6e0d2}
.ev .ino{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--yellow);border:2px solid var(--ink);font-size:12px;font-weight:700;margin-right:6px}
.kid{display:flex;flex-direction:column;gap:8px}
.kid-h{display:flex;align-items:center;gap:8px;font-size:19px;font-weight:700}
.kid-h .x{margin-left:auto}
.ind{display:grid;grid-template-columns:minmax(180px,1fr) auto;gap:8px;align-items:center;border-top:1px solid #e6e0d2;padding-top:6px}
.ind small{display:block;color:var(--soft)}
.lv{display:flex;gap:4px;flex-wrap:wrap}
.lv button{border:2px solid var(--ink);border-radius:999px;background:#fff;padding:3px 10px;font-size:14px}
.lv button.on{background:var(--green);color:#fff}
.kid textarea{width:100%;min-height:54px;border:2px solid #cfc8b8;border-radius:10px;padding:6px 8px;font-size:15px}
.addkid{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addkid input,.addkid select{border:2px solid var(--ink);border-radius:10px;padding:6px 10px;font-size:16px;background:#fff}
@media (max-width:600px){.ind{grid-template-columns:1fr}}

#print{display:none}
@media print{
  @page{size:A4 landscape;margin:12mm}
  body{overflow:visible;background:#fff}
  #app,#modal,#teacher{display:none!important}
  #print{display:block;font-size:10pt;color:#000}
  #print h1{font-size:16pt;margin:0 0 4pt}
  #print h2{font-size:13pt;margin:12pt 0 4pt;break-after:avoid}
  #print table{border-collapse:collapse;width:100%;margin-bottom:6pt}
  #print th,#print td{border:1px solid #999;padding:2pt 4pt;text-align:left;vertical-align:top}
  #print tr{break-inside:avoid}
  #print ul{margin:2pt 0 6pt;padding-left:14pt}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">Gezegenimi Kurtarıyorum</div>
    <nav class="steps" id="steps" aria-label="Araştırma adımları"></nav>
    <button class="grp" id="grp" type="button"></button>
    <button class="icon-btn" id="speak" type="button" aria-label="Sesli oku"></button>
    <button class="icon-btn gear" id="gear" type="button" aria-label="Öğretmen notları (basılı tutun)"></button>
  </header>
  <main id="main"></main>
  <footer class="ask"><span class="lbl">Öğretmen sorusu<small id="askcat"></small></span><span class="q" id="ask"></span><button type="button" class="more" id="more">Başka soru ›</button></footer>
</div>
<div id="modal" class="overlay" hidden></div>
<div id="teacher" class="overlay" hidden></div>
<div id="print"></div>
<noscript>Bu oyun için JavaScript gerekli.</noscript>
<script>
'use strict';
const INK = '#23324F';
const K = `stroke="${INK}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
const svg = (inner, vb = '0 0 100 100') => `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">${inner}</svg>`;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- drawings ---------- */
function crown() {
  const p = [];
  for (let i = 0; i < 44; i++) { const a = i * Math.PI * 2 / 44, r = i % 2 ? 35 : 41; p.push((50 + r * Math.cos(a)).toFixed(1) + ',' + (50 + r * Math.sin(a)).toFixed(1)); }
  return `<polygon points="${p.join(' ')}" fill="#c9ced6" ${K}/><circle cx="50" cy="50" r="28" fill="#E4572E" ${K}/><circle cx="50" cy="50" r="17" fill="none" stroke="#fff" stroke-width="2.5" opacity=".8"/>`;
}
function coil() {

let trVoice = null;
function pickVoice() { try { trVoice = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('tr')) || null; } catch (e) {} }
try { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
function say(t) {
  try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(t); u.lang = 'tr-TR'; if (trVoice) u.voice = trVoice; u.rate = .9; speechSynthesis.speak(u); } catch (e) {}
}
let actx = null, lastTick = 0;
function tick() {
  const now = Date.now(); if (now - lastTick < 60) return; lastTick = now;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = 'triangle'; o.frequency.setValueAtTime(880, t);
    g.gain.setValueAtTime(.18, t); g.gain.exponentialRampToValueAtTime(.001, t + .09);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + .1);
  } catch (e) {}
}

/* ---------- drag & drop (with tap-to-select fallback) ---------- */
let sel = null;
function dnd(el, onDrop, onTap) {
  el.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    e.preventDefault();
    const sx = e.clientX, sy = e.clientY, r = el.getBoundingClientRect();
    let ghost = null, hl = null;
    try { el.setPointerCapture(e.pointerId); } catch (_) {}
    const zoneAt = (x, y) => { const t = document.elementFromPoint(x, y); return t && t.closest('[data-drop]'); };
    const move = ev => {
      if (!ghost && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 8) {
        ghost = el.cloneNode(true); ghost.classList.add('ghost'); ghost.classList.remove('sel');
        ghost.style.width = r.width + 'px'; ghost.style.height = r.height + 'px';
        document.body.appendChild(ghost); el.classList.add('dragging');
      }
      if (ghost) {
        ghost.style.transform = `translate(${ev.clientX - (sx - r.left)}px,${ev.clientY - (sy - r.top)}px) rotate(-3deg)`;
        const m = $('#main'), mr = m.getBoundingClientRect();
        if (ev.clientY > mr.bottom - 48) m.scrollTop += 14; else if (ev.clientY < mr.top + 48) m.scrollTop -= 14;
        const z = zoneAt(ev.clientX, ev.clientY);
        if (z !== hl) { if (hl) hl.classList.remove('hl'); hl = z; if (hl) hl.classList.add('hl'); }
      }
    };
    const end = (ev, cancelled) => {
      el.removeEventListener('pointermove', move); el.removeEventListener('pointerup', up); el.removeEventListener('pointercancel', cancel);
      if (hl) hl.classList.remove('hl');
      if (ghost) {
        ghost.remove(); el.classList.remove('dragging');
        const z = cancelled ? null : zoneAt(ev.clientX, ev.clientY);
        if (z) { sel = null; onDrop(z.dataset.drop); }
      } else if (!cancelled) onTap();
    };
    const up = ev => end(ev, false), cancel = ev => end(ev, true);
    el.addEventListener('pointermove', move); el.addEventListener('pointerup', up); el.addEventListener('pointercancel', cancel);
  });
  el.addEventListener('click', e => e.stopPropagation());
}
function wire(host, place, onSelect) {
  $$('.card[data-id]', host).forEach(c => {
    const id = c.dataset.id;
    if (c.classList.contains('locked')) { c.addEventListener('click', e => { e.stopPropagation(); say(BYID[id].ad); if (onSelect) onSelect(id); }); return; }
    dnd(c, z => place(id, z), () => {
      sel = sel === id ? null : id;
      $$('.card.sel', host).forEach(x => x.classList.remove('sel'));
      if (sel) { c.classList.add('sel'); say(BYID[id].ad); }
      if (onSelect) onSelect(sel);
    });
  });
  $$('[data-drop]', host).forEach(z => z.addEventListener('click', () => { if (sel) { const id = sel; sel = null; place(id, z.dataset.drop); } }));
}
function card(o, mini, badge, extra) {

/* The virtual magnet. Light steel jumps from a short distance (the pull acts before touching and is
   weaker further away); heavy steel sticks on contact and moves with the magnet; for the lidded jar
   only the lid is steel; everything else never moves. With wall=true a sheet of paper stands between
   the magnet and the object. Several items (free play) can hang in a chain. */
function setupStage(items, opt) {
  const stage = $('#stage'), mag = $('#mag'), wallEl = $('#wall');
  const wall = !!opt.wall;
  let W, H, mw, mh, mx0, my0, R, mx, my, wx, ww, wy;
  const put = (el, x, y) => { el.style.transform = `translate(${x}px,${y}px)`; };
  const layout = () => {
    const r = stage.getBoundingClientRect(); W = r.width; H = r.height;
    const base = Math.min(H * .36, W * .32);
    mw = Math.max(84, Math.min(W * .18, H * .3)); mh = mw;
    R = Math.max(34, W * .07);
    if (wall) {
      ww = Math.max(8, W * .012); wx = W * .47; wy = H * .07;
      wallEl.style.left = wx + 'px'; wallEl.style.top = wy + 'px'; wallEl.style.width = ww + 'px'; wallEl.style.height = (H * .86 - wy + 2) + 'px';
      mx0 = W * .06; my0 = H * .3;
    } else { mx0 = W * .06; my0 = H * .05; }
    items.forEach(it => {
      it.s = base * it.o.sc;
      it.hx = wall ? wx + ww + 2 : W * it.fx - it.s / 2;
      it.hy = H * .87 - it.s;
      it.el.style.width = it.el.style.height = it.s + 'px';
      it.stuck = false; it.el.style.transition = 'none'; put(it.el, it.hx, it.hy);
    });
    mag.style.width = mag.style.height = mw + 'px';
    mx = mx0; my = my0; put(mag, mx, my);
  };
  const anchor = () => wall ? [mx + mw * .92, my + mh * .5] : [mx + mw * .5, my + mh * .9];
  const box = it => { // the part of the object the magnet can act on
    const o = it.o, y0 = it.hy + o.t * it.s;
    if (o.k === 'part') return [it.hx + it.s * .27, y0, it.s * .46, it.s * o.lid];
    const [a, b] = o.x || [0, 1]; // heavy steel: only the visible body counts as contact
    return [it.hx + it.s * a, y0, it.s * (b - a), it.s * (1 - o.t) * .9];
  };
  // hw: half the width of the magnet's poles, so contact means the drawn poles touch the drawn body
  const dist = (px, py, it, hw = 0) => { const [x, y, w, h] = box(it); const dx = Math.max(x - (px + hw), 0, (px - hw) - (x + w)), dy = Math.max(y - py, 0, py - (y + h)); return Math.hypot(dx, dy); };
  let drag = false, minD = Infinity, ox = 0, oy = 0, chain = [];
  const physics = () => {
    let [ax, ay] = anchor();
    if (wall) {
      const it = items[0], o = it.o;
      if (it.stuck) {
        if (ax < wx - (o.k === 'light' ? R * .6 : 8)) { it.stuck = false; chain = []; it.el.style.transition = 'transform 350ms ease-in'; put(it.el, it.hx, it.hy); return; }
        put(it.el, it.hx, Math.min(it.hy, Math.max(wy - it.s * o.t, ay - it.s * (o.t + (1 - o.t) * .45)))); return;
      }
      const d = dist(ax, ay, it); minD = Math.min(minD, d);
      const [, by, , bh] = box(it);
      if ((o.k === 'light' && d < R + ww) || ((o.k === 'heavy' || o.k === 'part') && ax >= wx - 4 && ay >= by - 6 && ay <= by + bh + 6)) {
        it.stuck = true; tick(); it.el.style.transition = o.k === 'light' ? 'transform 90ms ease-out' : 'transform 120ms linear';
        put(it.el, it.hx, Math.min(it.hy, Math.max(wy - it.s * o.t, ay - it.s * (o.t + (1 - o.t) * .45))));
      }
      return;
    }
    // chain: each stuck item hangs under the previous one
    let cy = ay;
    chain.forEach((it, i) => {
      const o = it.o, x = ax - it.s / 2 + (i % 2 ? 4 : -4) * (i ? 1 : 0), y = cy - (o.k === 'part' ? o.t : o.t) * it.s;
      put(it.el, x, y); cy = y + it.s * (o.k === 'light' ? .78 : .9);
    });
    const tipY = cy;
    items.forEach(it => {
      if (it.stuck) return;
      const o = it.o, d = dist(ax, tipY, it);
      if (items.length === 1) minD = Math.min(minD, dist(ax, ay, it));
      const canJump = o.k === 'light' && d < (chain.length ? R * .6 : R);
      const touch = (o.k === 'heavy' || o.k === 'part') && !chain.length && dist(ax, tipY, it, mw * .32) < 4;
      if (canJump || touch) {
        it.stuck = true; chain.push(it); tick();
        it.el.style.transition = o.k === 'light' ? 'transform 90ms ease-out' : 'transform 120ms linear';
        const y = tipY - o.t * it.s; put(it.el, ax - it.s / 2, y);
        return;
      }
      if (o.k === 'light' && d < R * 2) { // the pull gets stronger as the magnet comes closer
        const k = (1 - (d - R) / R) * .06 * it.s, cx = it.hx + it.s / 2, cyy = it.hy + it.s / 2, l = Math.hypot(ax - cx, tipY - cyy) || 1;
        it.el.style.transition = 'transform 80ms linear'; put(it.el, it.hx + (ax - cx) / l * k, it.hy + (tipY - cyy) / l * k); return;
      }
      it.el.style.transition = 'transform 200ms ease'; put(it.el, it.hx, it.hy);
    });
  };
  const down = e => {
    if (e.button > 0) return;
    e.preventDefault(); drag = true; minD = Infinity;
    if (firstDrag) { firstDrag = false; mag.classList.remove('pulse'); }
    const r = stage.getBoundingClientRect(); ox = e.clientX - r.left - mx; oy = e.clientY - r.top - my;
    mag.style.transition = 'none'; mag.style.cursor = 'grabbing';
    try { mag.setPointerCapture(e.pointerId); } catch (_) {}
  };
  const move = e => {
    if (!drag) return;
    const r = stage.getBoundingClientRect();
    const maxX = wall ? wx - 1 - mw * .92 : W - mw * .8;
    mx = Math.min(Math.max(e.clientX - r.left - ox, -mw * .2), maxX);
    my = Math.min(Math.max(e.clientY - r.top - oy, -mh * .2), H * .86 - mh * (wall ? .5 : .6));
    put(mag, mx, my); physics();
  };
  const up = () => {
    if (!drag) return;
    drag = false; mag.style.cursor = '';
    const tried = minD < R * 2;
    chain = [];
    mag.style.transition = 'transform 450ms ease';
    mx = mx0; my = my0; put(mag, mx, my);
    items.forEach(it => { it.stuck = false; it.el.style.transition = 'transform 450ms ease'; put(it.el, it.hx, it.hy); });
    if (tried && opt.onTrial) opt.onTrial();
  };
  mag.addEventListener('pointerdown', down);
  mag.addEventListener('pointermove', move);
  mag.addEventListener('pointerup', up);
  mag.addEventListener('pointercancel', up);
  layout();
  let rt = null;
  const onResize = () => { clearTimeout(rt); rt = setTimeout(() => { if (!drag) { mag.style.transition = 'none'; chain = []; layout(); } }, 120); };
  window.addEventListener('resize', onResize);
  return () => { clearTimeout(rt); window.removeEventListener('resize', onResize); };
}

/* ---------- teacher ---------- */
let tTab = 'rehber';
const PL = k => (k && PRED[k] ? PRED[k][0] : '–');
function gEvidence(gid) {
  const g = G(gid), out = [];
  const preds = ALL.filter(o => g.pred[o.id]), whyN = preds.filter(o => (g.why[o.id] || []).length);
  const cnt = {}; whyN.forEach(o => g.why[o.id].forEach(k => { cnt[k] = (cnt[k] || 0) + 1; }));
  out.push([1, `${preds.length} tahmin; ${whyN.length} tanesinde neden seçildi${Object.keys(cnt).length ? ' (' + Object.entries(cnt).sort((a, b) => b[1] - a[1]).map(([k, n]) => `${WHY[k][0].toLowerCase()} ×${n}`).join(', ') + ')' : ''}.`]);
  const tested = ALL.filter(o => res(g, o.id)), trials = ALL.reduce((a, o) => a + ((g.test[o.id] || {}).n || 0), 0);
  const multi = ALL.filter(o => ((g.test[o.id] || {}).n || 0) > 1).map(o => o.ad);
  const changed = ALL.filter(o => new Set((g.test[o.id] || {}).h || []).size > 1).map(o => o.ad);
  out.push([1, `${tested.length}/${ALL.length} nesne kaydedildi, toplam ${trials} deneme.${multi.length ? ' Tekrar denenen: ' + multi.join(', ') + '.' : ''}${changed.length ? ' Kaydı değişen: ' + changed.join(', ') + '.' : ''}`]);
  const sur = ALL.filter(o => surprise(g, o.id));
  out.push([2, sur.length ? `Şaşırtanlar: ${sur.map(o => `${o.ad} (${PL(g.pred[o.id])}${(g.why[o.id] || []).length ? ', ' + g.why[o.id].map(k => WHY[k][0].toLowerCase()).join('/') : ''} → ${RES[res(g, o.id)][0]})`).join('; ')}.` : 'Henüz şaşırtan yok.']);
  const hot = MAIN.filter(o => g.looks[o.id] === 'metal' && res(g, o.id) === 'cekmedi').map(o => o.ad);
  if (Object.keys(g.looks).length) out.push([2, `“Metal gibi ama çekmedi” hücresi: ${hot.length ? hot.join(', ') : 'boş'}.`]);
  out.push([2, `Fikir: ${g.idea0 ? '“' + g.idea0 + '”' : '(ilk fikir yazılmadı)'} → ${g.idea1 ? '“' + g.idea1 + '”' : '(şimdiki kural yazılmadı)'}`]);
  const nNew = NEW.filter(o => g.pred[o.id]).length, newSur = NEW.filter(o => surprise(g, o.id)).map(o => o.ad);
  if (nNew) out.push([3, `Yeni nesneler: ${nNew}/6 tahmin, ${NEW.filter(o => res(g, o.id)).length}/6 deneme${newSur.length ? '; kuralı zorlayan: ' + newSur.join(', ') : ''}.`]);
  const pp = ALL.filter(o => res(g, o.id, g.paper));
  if (g.paperPred || pp.length) out.push([3, `Kâğıt testi: tahmin ${PL(g.paperPred)}; ${pp.map(o => `${o.ad} ${RES[res(g, o.id, g.paper)][0].toLowerCase()}`).join(', ') || 'henüz deneme yok'}.`]);
  const qs = S.questions.filter(q => q.g === gid).map(q => '“' + q.t + '”');
  if (qs.length) out.push([3, `Merak panosundaki soruları: ${qs.join(' ')}`]);
  return out;
}
function gTable(gid) {
  const g = G(gid);
  const rows = ALL.map(o => {
    const p = g.pred[o.id], t = g.test[o.id] || {}, l = g.looks[o.id], pp = res(g, o.id, g.paper);
    return `<tr><td>${esc(o.ad)}${NEW.includes(o) ? ' <small>(yeni)</small>' : ''}</td><td>${o.m}</td><td>${PL(p)}</td><td>${(g.why[o.id] || []).map(k => WHY[k][0]).join(', ')}</td><td>${t.r ? RES[t.r][0] : '–'}</td><td>${t.n || 0}</td><td>${(t.h || []).length > 1 ? t.h.map(r => RES[r][0]).join(' → ') : ''}</td><td>${l ? LOOK[l][0] : '–'}</td><td>${pp ? RES[pp][0] : ''}</td><td class="s">${surprise(g, o.id) ? 'şaşırtan' : ''}</td></tr>`;
  }).join('');
  return `<table class="tt"><thead><tr><th>Nesne</th><th>Malzeme</th><th>Tahmin</th><th>Neden</th><th>Sonuç (çocukların kaydı)</th><th>Deneme</th><th>Kayıt geçmişi</th><th>Metal gibi?</th><th>Kâğıt arkasından</th><th></th></tr></thead><tbody>${rows}</tbody></table>`;
}
function openTeacher() { $('#modal').hidden = true; $('#teacher').hidden = false; renderTeacher(); }
function renderTeacher() {
  const el = $('#teacher');
  const tabs = [['rehber', 'Rehber'], ['gruplar', 'Grup kayıtları'], ['cocuklar', 'Çocuklar'], ['sorular', 'Sorular']];
  let body = '';
  if (tTab === 'rehber') body = `
    <div class="t-box"><h3>Akış (sunumdaki beş adım)</h3><ul>
      <li><b>1. gün (yaklaşık 30 dk):</b> 1 Merak et (harita, serbest keşif, merak panosu) → 2 Tahmin et (her nesne için “neden?”) → 3 Dene.</li>
      <li><b>2. gün (yaklaşık 20 dk):</b> 4 Karşılaştır (Şaşırtanlar, Metal mi?, Gruplar) → 5 Uygula (yeni nesneler, kâğıt testi).</li>
      <li>Oyun akıllı tahtada, tablette ya da bilgisayarda çalışır. Gruplar 3–4 çocuktan oluşur; her grup kendi rengiyle kaydeder. Çocuklar sırayı ve nesneleri kendileri seçer; öğretmen gruplar arasında dolaşır, açıklamak yerine sorar.</li></ul></div>
    <div class="t-box"><h3>Oyunun kuralları</h3><ul>
      <li>Oyun tahmini puanlamaz, “doğru/yanlış” demez. Sanal mıknatıs ne olduğunu gösterir; sonucu çocuklar kendileri kaydeder.</li>
      <li>Bir nesne denendikten sonra tahmini değiştirilemez; Karşılaştır'da önceki düşünce görünür kalır. Kayıt ise her zaman tekrar denenip değiştirilebilir; eski kayıtlar saklanır.</li>
      <li>Tahmin ile kayıt uyuşmazsa nesne <b>Şaşırtanlar</b> rafına geçer. “Tekrar dene” düğmesi aynı nesneyi yeniden test ettirir.</li>
      <li>“İlk fikrimiz” ve “Şimdiki kuralımız”: grubun fikrini çocukların kendi sözleriyle siz yazarsınız. Seçenek sunulmaz, böylece oyun cevabı vermez.</li>
      <li>Mıknatıs: hafif çelik (ataç, şişe kapağı, çivi, vida) dokunmadan sıçrar ve yaklaştıkça kıpırdar; ağır çelik (salça ve ton balığı kutusu, kavanoz kapağı) dokununca yapışıp mıknatısla gider; kapaklı kavanozda yalnızca kapağa değince gelir; diğerleri kıpırdamaz. Kâğıt araya girince de çeker.</li></ul></div>
    <div class="t-box"><h3>Beklenen fikirler ve öğretmenin yaptığı</h3><p>Fikirleri düzeltmiyoruz; çocuk kendi fikrini dener. Hedef fikir: “Bazıları çeker. Denemeden bilemeyiz.”</p><ul>
      <li><b>“Parlak olanlar çeker.”</b> Görünüşe göre tahmin. “Neden?” seçtirin ve denetin; folyo ve içecek kutusu bu fikri sınar.</li>
      <li><b>“Metaller çeker.”</b> Salça kutusu çekti, içecek kutusu çekmedi; ikisi de metal gibi. Metal mi? tablosunda “Metal gibi ama çekmedi” hücresine baktırın: “Bu iki kutu neden farklı olabilir?”</li>
      <li><b>“Çok ağır, kaldıramaz.”</b> Çekmeyi kaldırmakla karıştırıyor. Hafif ataç da ağır kutu da çekiliyor: “Ağır olmak fark ediyor mu?”</li>
      <li><b>“Mıknatıs yapışkan.”</b> Yapıştırıcı fikri. Ataç değmeden sıçrıyor: “Dokunmadan önce bir şey oldu mu?”</li>
      <li><b>“Mıknatıs bozuldu!”</b> Eski kuralı koruyup mıknatısı suçluyor. Düzeltmek yerine ataçla bir daha denetin.</li>
      <li><b>“Kapağı çekti, kavanozu çekmedi.”</b> Kanıt kullanıyor, nesnenin parçalarına bakıyor. Kapaklı kavanozu yandan ve kapaktan denetin; not alın (gösterge 4).</li></ul></div>
    <div class="t-box"><h3>Bilim notu</h3><ul>
      <li>Oyun tipik sonucu gösterir. Gerçek kutular ve kapaklar farklı olabilir; örneğin bazı ton balığı kutuları alüminyumdur. Çocuklar sorarsa bunu konuşun.</li>
      <li>Gördüğümüz (“mıknatıs kutuyu çekti”) ile açıklamayı (“farklı bir metal”) ayrı tutun.</li>
      <li>Veriler yalnızca bu tablette saklanır. Çocuklar için ilk ad ya da rumuz kullanın.</li></ul></div>
    <div class="t-box"><h3>Öğretmen soruları (ekranın altındaki “Başka soru ›” ile değişir)</h3><ul>
      ${[['merak', '1 Merak et'], ['oyna', '1 Serbest keşif'], ['tahmin', '2 Tahmin et'], ['dene', '3 Dene'], ['sasirt', '4 Şaşırtanlar'], ['metal', '4 Metal mi?'], ['gruplar', '4 Gruplar'], ['u-tahmin', '5 Uygula: tahmin'], ['u-dene', '5 Uygula: dene'], ['u-sasirt', '5 Uygula: şaşırtanlar'], ['u-kagit', '5 Yeni sorumuz']].map(([k, ad]) => `<li><b>${ad}:</b> ${ASK[k].map(([q, c]) => `<span class="cat">${c}</span>${esc(q)}`).join(' ')}</li>`).join('')}</ul></div>`;
  else if (tTab === 'gruplar') body = (GROUPS.some(([id]) => hasData(id)) ? GROUPS.filter(([id]) => hasData(id)) : GROUPS).map(([id, ad, c]) => `<div class="t-box"><h3><span class="dot" style="background:${c}"></span> ${ad} grup</h3>
      <ul class="ev">${gEvidence(id).map(([n, t]) => `<li><span class="ino" title="Gösterge ${n}">${n}</span>${esc(t)}</li>`).join('')}</ul>
      <div class="tscroll">${gTable(id)}</div></div>`).join('') + '<p class="small">Numaralar gözlem göstergeleridir (Çocuklar sekmesi). Grup kaydı, çocuk başına değerlendirmeye kanıt olarak kullanılır.</p>';
  else if (tTab === 'sorular') body = `<div class="t-box"><h3>Merak panosu (${S.questions.length})</h3>${S.questions.length ? `<ul>${S.questions.map(q => `<li>${esc(q.t)}${q.g && GBY[q.g] ? ` <small>(${GBY[q.g][1]} grup)</small>` : ''}</li>`).join('')}</ul>` : '<p>Henüz soru yok.</p>'}<p><button type="button" class="tbtn" data-act="board">Panoyu aç</button></p></div>`;
  else body = `
    <div class="t-box"><h3>Çocuk ekle</h3><div class="addkid"><input id="kname" placeholder="Ad" maxlength="30" aria-label="Ad"><select id="kgrp" aria-label="Grup">${GROUPS.map(([id, ad]) => `<option value="${id}"${S.group === id ? ' selected' : ''}>${ad}</option>`).join('')}</select><button type="button" class="tbtn" id="kadd">Ekle</button></div>
    <p class="small" style="margin-top:8px">Her çocuk, her gösterge için: Kendi başına · Destekle · Henüz değil. Kanıt: oyunun kaydı (tahmin, neden, sonuç, tekrar denemeler) ve kısa notlar. Ayrı bir test yok; doğru cevap değil, akıl yürütme değerlendirilir.</p></div>
    ${S.kids.map(k => `<div class="t-box kid" data-kid="${k.id}"><div class="kid-h"><span class="dot" style="background:${(GBY[k.grup] || GROUPS[0])[2]}"></span>${esc(k.ad)}<button type="button" class="tbtn x" data-del>Sil</button></div>
      ${IND.map(([t, goal, hint], i) => `<div class="ind"><span>${i + 1}. ${t} <small>Hedef ${goal} · ${hint}</small></span><div class="lv">${LV.map(([lk, la]) => `<button type="button" class="${k.ind[i] === lk ? 'on' : ''}" data-i="${i}" data-lv="${lk}">${la}</button>`).join('')}</div></div>`).join('')}
      <textarea data-note placeholder="Kısa not: ne dedi, ne yaptı? (örn. “Kapak çekti, kavanoz çekmedi.”)">${esc(k.not || '')}</textarea></div>`).join('')}`;
  el.innerHTML = `<div class="t-wrap"><div class="t-head"><h2>Öğretmen notları</h2>
    <button type="button" class="tbtn" data-act="print">Yazdır</button><button type="button" class="tbtn warn" data-act="reset">Sıfırla</button><button type="button" class="tbtn" data-act="close">Kapat</button>
    <div class="t-tabs">${tabs.map(([k, ad]) => `<button type="button" class="tbtn${tTab === k ? ' on' : ''}" data-tab="${k}">${ad}</button>`).join('')}</div></div>${body}</div>`;
  $$('[data-tab]', el).forEach(b => b.onclick = () => { tTab = b.dataset.tab; renderTeacher(); });
  $('[data-act="close"]', el).onclick = () => { el.hidden = true; render(); };
  $('[data-act="print"]', el).onclick = printAll;
  const bb = $('[data-act="board"]', el); if (bb) bb.onclick = () => { el.hidden = true; openBoard(); };
  $('[data-act="reset"]', el).onclick = () => {
    if (!confirm('Tüm grup kayıtları, sorular ve çocuk notları silinsin mi? Bu geri alınamaz.')) return;
    S = blank(); save(); el.hidden = true; mapSel = 'geri'; render();
  };
  const add = $('#kadd', el);
  if (add) {
    const doAdd = () => { const n = $('#kname', el).value.trim(); if (!n) return; S.kids.push({id:Date.now().toString(36) + S.kids.length, ad:n, grup:$('#kgrp', el).value, ind:[null, null, null, null], not:''}); save(); renderTeacher(); setTimeout(() => { const i = $('#kname'); if (i) i.focus(); }, 0); };
    add.onclick = doAdd; $('#kname', el).onkeydown = e => { if (e.key === 'Enter') doAdd(); };
  }
  $$('[data-kid]', el).forEach(box => {
    const k = S.kids.find(x => x.id === box.dataset.kid);
    $$('[data-lv]', box).forEach(b => b.onclick = () => { const i = +b.dataset.i; k.ind[i] = k.ind[i] === b.dataset.lv ? null : b.dataset.lv; save(); renderTeacher(); });
    $('[data-note]', box).oninput = e => { k.not = e.target.value; save(); };
    $('[data-del]', box).onclick = () => { if (confirm(k.ad + ' silinsin mi?')) { S.kids = S.kids.filter(x => x !== k); save(); renderTeacher(); } };
  });
}
function printAll() {
  const lvName = Object.fromEntries(LV);
  const d = new Date().toLocaleDateString('tr-TR');
  const used = GROUPS.filter(([id]) => hasData(id));
  $('#print').innerHTML = `<h1>Gezegenimi Kurtarıyorum · Mıknatıs araştırması</h1><p>Öğretmen kaydı · ${d}</p>
    ${(used.length ? used : GROUPS).map(([id, ad]) => `<h2>${ad} grup</h2><ul>${gEvidence(id).map(([n, t]) => `<li>[${n}] ${esc(t)}</li>`).join('')}</ul>${gTable(id)}`).join('')}
    <h2>Merak panosu</h2>${S.questions.length ? `<ul>${S.questions.map(q => `<li>${esc(q.t)}${q.g && GBY[q.g] ? ` (${GBY[q.g][1]})` : ''}</li>`).join('')}</ul>` : '<p>Soru yok.</p>'}
    <h2>Çocuklar</h2>${S.kids.length ? `<table><thead><tr><th>Ad</th><th>Grup</th>${IND.map(([t], i) => `<th>${i + 1}. ${t}</th>`).join('')}<th>Not</th></tr></thead><tbody>${S.kids.map(k => `<tr><td>${esc(k.ad)}</td><td>${(GBY[k.grup] || ['', ''])[1]}</td>${k.ind.map(v => `<td>${v ? lvName[v] : ''}</td>`).join('')}<td>${esc(k.not || '')}</td></tr>`).join('')}</tbody></table>` : '<p>Kayıt yok.</p>'}`;
  window.print();
}

/* ---------- boot ---------- */
$('#speak').innerHTML = svg(I.speaker, '0 0 60 60');
$('#speak').onclick = sayScreen;
$('#more').onclick = () => { const v = view(); askIdx[v] = ((askIdx[v] || 0) + 1) % ASK[v].length; setAsk(); };
$('#gear').innerHTML = svg(I.gear, '0 0 60 60') + '<svg class="ring" viewBox="0 0 44 44"><circle cx="22" cy="22" r="20"/></svg>';
$('#grp').onclick = pickGroup;
(() => {
  const gb = $('#gear'); let t = null;
  const stop = () => { clearTimeout(t); gb.classList.remove('holding'); };
  gb.addEventListener('pointerdown', e => { e.preventDefault(); gb.classList.add('holding'); t = setTimeout(() => { stop(); openTeacher(); }, 800); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => gb.addEventListener(ev, stop));
  gb.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openTeacher(); } });
  gb.addEventListener('contextmenu', e => e.preventDefault());
})();
if (!STEP[S.screen]) S.screen = 'merak';
render();
</script>
